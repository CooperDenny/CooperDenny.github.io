[build]
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# The R Markdown / static project write-ups under public/projects/<slug>/index.html
# are served as flat files, not app routes — Next.js only auto-resolves a
# directory URL to its index.html under `next export`, not on the Netlify
# Next.js runtime, so a trailing-slash request needs an explicit rewrite.
[[redirects]]
  from = "/projects/:slug/"
  to = "/projects/:slug/index.html"
  status = 200
